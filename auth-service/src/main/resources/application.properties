spring.application.name=auth-service
server.port=${PORT:8081}

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:himanshu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console (disabled for MySQL)
spring.h2.console.enabled=false

# JWT Secret (must match measurement-service and history-service)
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}

# Logging
logging.level.com.app.authservice=INFO
logging.level.org.springframework.security=INFO

# Actuator (for Render health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
