# ===============================
# 🚀 Application
# ===============================
spring.application.name=auth-service
server.port=${PORT:8081}

# ===============================
# 🐬 MySQL Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:himanshu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 🧠 JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# 🔐 JWT Configuration (COMMON)
# ===============================
jwt.secret=${JWT_SECRET:MySuperSecureJWTSecretKeyForProduction1234567890}

# ===============================
# 📊 Logging
# ===============================
logging.level.com.app.authservice=INFO
logging.level.org.springframework.security=INFO

# ===============================
# ❤️ Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always