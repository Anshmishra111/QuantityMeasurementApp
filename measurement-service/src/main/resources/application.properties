spring.application.name=measurement-service
server.port=${PORT:8082}

# MySQL Configuration (Shared DB: measurement_db)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/measurement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:himanshu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (must match auth-service and history-service)
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.app.measurementservice=INFO
logging.level.org.hibernate.SQL=DEBUG
