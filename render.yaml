services:
  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: api-gateway
    env: docker
    plan: free
    dockerContext: .
    dockerfile: Dockerfile
    dockerBuildArgs:
      - key: SERVICE_NAME
        value: api-gateway
    healthCheckPath: /actuator/health
    envVars:
      - key: AUTH_SERVICE_URL
        sync: false
      - key: MEASUREMENT_SERVICE_URL
        sync: false
      - key: HISTORY_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        value: "*"

  # ── Auth Service ─────────────────────────────────────────────────────────────
  - type: web
    name: auth-service
    env: docker
    plan: free
    dockerContext: .
    dockerfile: Dockerfile
    dockerBuildArgs:
      - key: SERVICE_NAME
        value: auth-service
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  # ── Measurement Service ───────────────────────────────────────────────────────
  - type: web
    name: measurement-service
    env: docker
    plan: free
    dockerContext: .
    dockerfile: Dockerfile
    dockerBuildArgs:
      - key: SERVICE_NAME
        value: measurement-service
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  # ── History Service ───────────────────────────────────────────────────────────
  - type: web
    name: history-service
    env: docker
    plan: free
    dockerContext: .
    dockerfile: Dockerfile
    dockerBuildArgs:
      - key: SERVICE_NAME
        value: history-service
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
