spring.application.name=history-service
server.port=8083

# MySQL Configuration (Shared DB: measurement_db, Read-Only)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/measurement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=himanshu@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — ddl-auto=none so history-service never touches the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.app.historyservice=DEBUG
